name: Fetch Unread Posts

on:
  workflow_dispatch:
  schedule:
    # 平日 6:00〜21:00 JST の毎時実行 (JST = UTC+9)
    - cron: "0 21-23 * * 0-4" # 平日 6:00〜8:00 JST
    - cron: "0 0-12 * * 1-5"  # 平日 9:00〜21:00 JST

jobs:
  fetch-unread:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: pnpm exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - uses: actions/cache/restore@v5
        with:
          path: data/seen-posts.json
          key: seen-posts-${{ github.run_id }}
          restore-keys: seen-posts-

      - run: pnpm exec playwright test -g "fetch unread"
        env:
          CODMON_EMAIL: ${{ secrets.CODMON_EMAIL }}
          CODMON_PW: ${{ secrets.CODMON_PW }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - uses: actions/cache/save@v5
        if: always()
        with:
          path: data/seen-posts.json
          key: seen-posts-${{ github.run_id }}
